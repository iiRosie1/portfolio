<body>
    <div id="navbar"></div>

                <div class="info-group">

                <div class="info-group">
                    <span class="info-label">ORGANIZATION</span>
                    <span class="info-text">Waterloo Undergraduate Student Association</span>
                </div>
            </div>
        </div>
        <div class="slides-container">
            <!-- Digital Screen Graphics -->
            <h3 class="section-title">Digital Screen Graphics</h3>
            <div class="image-row">
                <div class="slide">
                    <img src="images/wusa/Glow Digital Screen Graphics_Horizontal.png" alt="Glow Digital Screen Graphics" />

            </div>

                </div>
            </div>
        -->

            <h3 class="section-title">Mates Events</h3>
            <div class="image-row">
                <div class="slide">
                    <img src="images/wusa/Mates Nature Walk_Grid.png" alt="Mates Nature Walk" />
                </div>
                <div class="slide">
                    <img src="images/wusa/Mates Pot Painting Grid.png" alt="Pot Painting Event" />
                </div>
            </div>

            <!-- Thrift Sidewalk Sale -->
            <h3 class="section-title">Thrift Sidewalk Sale</h3>
            <div class="image-row">
                <div class="slide">
                    <img src="images/wusa/ThriftSidewalkSale_Screen Horizontal.png" alt="Thrift Sidewalk Sale" />

            </div>

            </div>
            -->

            <!-- Educational Materials -->
            <h3 class="section-title">Educational Materials</h3>
            <div class="image-row">
                <div class="slide">
                    <img src="images/wusa/Smarty Pants Coloring Page.png" alt="Smarty Pants Coloring Page" />
                </div>
                <div class="slide">
                    <img src="images/wusa/Smarty Pants Coloring Page 2.png" alt="Smarty Pants Coloring Page" />
